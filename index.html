<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifica Identità</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        #main-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .status-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            max-width: 80%;
            width: 320px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #27ae60;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .closed-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .closed-sub { font-size: 14px; opacity: 0.8; }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            const googleWebApp = "https://script.google.com/macros/s/AKfycbwHLD12A5oPVuap8FeWbdloprkftANLNovI3ron8diQXIlyP0Q3xNQd1apiPM7Zwotp/exec";

            if (idParam) {
                const targetUrl = googleWebApp + "?id=" + encodeURIComponent(idParam);
                document.getElementById("main-container").innerHTML = `
                    <iframe src="${targetUrl}" allow="fullscreen" style="width:100%; height:100%; border:none;"></iframe>
                `;
            } else {
                document.getElementById("main-container").innerHTML = `
                    <div class="status-container">
                        <div class="card">
                            <div class="closed-title">⚠️ Attenzione</div>
                            <div class="closed-sub">Nessun codice identificativo fornito.</div>
                        </div>
                    </div>
                `;
            }
        });

        // Ascolta il messaggio inviato dall'iframe quando si clicca CHIUDI
        window.addEventListener("message", function(event) {
            if (event.data === "CLOSE_APP") {
                // Prova prima a chiudere la scheda del browser
                window.close();
                
                // Se il browser blocca la chiusura, mostra una schermata neutra elegante su GitHub
                document.getElementById("main-container").innerHTML = `
                    <div class="status-container">
                        <div class="card">
                            <div class="closed-title">Sessione Terminata</div>
                            <div class="closed-sub">La verifica è stata completata.<br>Puoi chiudere la finestra.</div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</head>
<body>
    <div id="main-container">
        <div class="status-container">
            <div class="card">
                <div class="spinner"></div>
                <p>Verifica identità in corso...</p>
            </div>
        </div>
    </div>
</body>
</html>
