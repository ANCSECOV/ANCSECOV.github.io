<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Identità</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 80%;
            width: 350px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #27ae60;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #c0392b;
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Estrae i parametri dall'URL
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            // URL della Google Web App
            const googleWebApp = "https://script.google.com/macros/s/AKfycbwHLD12A5oPVuap8FeWbdloprkftANLNovI3ron8diQXIlyP0Q3xNQd1apiPM7Zwotp/exec";

            if (idParam) {
                // Preserva l'ID e applica encodeURIComponent per proteggere i caratteri speciali (+, /, =, °)
                const targetUrl = googleWebApp + "?id=" + encodeURIComponent(idParam);
                
                // Reindirizza senza lasciare la pagina di GitHub nella cronologia del browser
                window.location.replace(targetUrl);
            } else {
                // Se l'ID manca, mostra un messaggio d'errore a schermo
                document.getElementById("content").innerHTML = `
                    <div class="error">
                        <h2>⚠️ Attenzione</h2>
                        <p>Nessun codice identificativo fornito.</p>
                    </div>
                `;
            }
        });
    </script>
</head>
<body>
    <div class="card" id="content">
        <div class="spinner"></div>
        <p>Reindirizzamento alla verifica in corso...</p>
    </div>
</body>
</html>
