<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifica Identità</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        #main-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Schermata di caricamento che copre l'iframe finché non è pronto */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            max-width: 80%;
            width: 320px;
            color: white;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #27ae60;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .closed-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .closed-sub { font-size: 15px; opacity: 0.85; line-height: 1.4; }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            const googleWebApp = "https://script.google.com/macros/s/AKfycbwHLD12A5oPVuap8FeWbdloprkftANLNovI3ron8diQXIlyP0Q3xNQd1apiPM7Zwotp/exec";

            if (idParam) {
                const targetUrl = googleWebApp + "?id=" + encodeURIComponent(idParam);
                
                const iframe = document.createElement("iframe");
                iframe.src = targetUrl;
                iframe.allow = "fullscreen";
                
                // Quando l'iframe ha finito di caricare, nascondiamo lo spinner
                iframe.onload = function() {
                    const overlay = document.getElementById("loading-overlay");
                    if (overlay) {
                        overlay.style.opacity = "0";
                        setTimeout(() => overlay.remove(), 300);
                    }
                };

                document.getElementById("main-container").appendChild(iframe);
            } else {
                document.getElementById("loading-overlay").innerHTML = `
                    <div class="card">
                        <div class="closed-title">⚠️ Attenzione</div>
                        <div class="closed-sub">Nessun codice identificativo fornito.</div>
                    </div>
                `;
            }
        });

        // Ascolta il messaggio di chiusura dall'iframe
        window.addEventListener("message", function(event) {
            if (event.data === "CLOSE_APP") {
                window.close();
                document.getElementById("main-container").innerHTML = `
                    <div id="loading-overlay" style="z-index:100; opacity:1;">
                        <div class="card">
                            <div class="closed-title">Sessione Terminata</div>
                            <div class="closed-sub">La verifica è stata completata.<br>Puoi chiudere la finestra.</div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</head>
<body>
    <div id="main-container">
        <div id="loading-overlay">
            <div class="card">
                <div class="spinner"></div>
                <div class="closed-title">Verifica in corso</div>
                <div class="closed-sub">Connessione al database...</div>
            </div>
        </div>
    </div>
</body>
</html>
