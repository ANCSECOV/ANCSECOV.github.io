<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifica Identità</title>
    <style>
        /* Reset totale per garantire che l'iframe occupi il 100% reale della schermata mobile */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available; /* Correzione specifica per la barra di Safari su iOS */
            overflow: hidden;
            background-color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        #main-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* L'iframe si estende al 100% in altezza e larghezza */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Schermata di caricamento iniziale / errore */
        .status-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
        }
        
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 80%;
            width: 350px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #27ae60;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #c0392b;
            font-weight: bold;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            // URL della Google Web App
            const googleWebApp = "https://script.google.com/macros/s/AKfycbwHLD12A5oPVuap8FeWbdloprkftANLNovI3ron8diQXIlyP0Q3xNQd1apiPM7Zwotp/exec";

            if (idParam) {
                const targetUrl = googleWebApp + "?id=" + encodeURIComponent(idParam);
                
                // Inietta l'iframe forzando l'altezza al 100%
                document.getElementById("main-container").innerHTML = `
                    <iframe src="${targetUrl}" allow="fullscreen" style="width:100%; height:100%; border:none;"></iframe>
                `;
            } else {
                document.getElementById("main-container").innerHTML = `
                    <div class="status-container">
                        <div class="card">
                            <div class="error">
                                <h2>⚠️ Attenzione</h2>
                                <p>Nessun codice identificativo fornito.</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</head>
<body>
    <div id="main-container">
        <div class="status-container">
            <div class="card">
                <div class="spinner"></div>
                <p>Verifica identità in corso...</p>
            </div>
        </div>
    </div>
</body>
</html>
