<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifica Identità</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        #main-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenitore centrato per spinner e testo */
        #loader-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 1;
            width: 100%;
        }

        .spinner {
            width: 46px;
            height: 46px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #27ae60;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            font-weight: 600;
            opacity: 0.9;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            background-color: transparent;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            const googleWebApp = "https://script.google.com/macros/s/AKfycbwHLD12A5oPVuap8FeWbdloprkftANLNovI3ron8diQXIlyP0Q3xNQd1apiPM7Zwotp/exec";

            if (idParam) {
                const targetUrl = googleWebApp + "?id=" + encodeURIComponent(idParam);
                const iframe = document.createElement("iframe");
                iframe.src = targetUrl;
                iframe.allow = "fullscreen";
                
                // Aggiunge l'iframe affianco allo spinner (non cancellandolo)
                document.getElementById("main-container").appendChild(iframe);
            }
        });

        window.addEventListener("message", function(event) {
            if (event.data === "CLOSE_APP") {
                // 1. Tenta la chiusura reale (funziona da App Fotocamera)
                window.close();
                
                // 2. Fallback per il lettore QR da Centro di Controllo / In-App
                setTimeout(function() {
                    document.getElementById("main-container").innerHTML = `
                        <div style="display:flex; justify-content:center; align-items:center; height:100vh; background-color:#2c3e50; color:white; font-family:-apple-system,sans-serif; text-align:center; padding:20px;">
                            <div style="background:rgba(255,255,255,0.1); padding:30px; border-radius:16px; backdrop-filter:blur(10px);">
                                <h2 style="margin:0 0 10px 0; font-size:20px;">Sessione Terminata</h2>
                                <p style="margin:0; opacity:0.8; font-size:14px;">Puoi chiudere la finestra con la X</p>
                            </div>
                        </div>
                    `;
                }, 100);
            }
        });        
    </script>
</head>
<body>
    <div id="main-container">
        <div id="loader-box">
            <div class="spinner"></div>
            <div class="loading-text">Verifica in corso...</div>
        </div>
    </div>
</body>
</html>
